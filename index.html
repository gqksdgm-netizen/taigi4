<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>臺語四格故事挑戰</title>
<style>
:root { color-scheme:light; --ink:#342b32; --muted:#6a5760; --rose:#cc5682; --line:#ebbed0; --light:#fff7fa; --card:#ffffff; }
* { box-sizing:border-box; }
body { margin:0; padding:20px; background:#fff8fb; color:var(--ink); font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif; }
main { max-width:1060px; margin:auto; }
h1 { text-align:center; margin:5px 0 4px; color:#81365a; font-size:clamp(24px,3.3vw,34px); }
p.subtitle { color:var(--muted); text-align:center; margin:0 0 16px; }
.board { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.scene { min-width:0; background:var(--card); border:3px solid #e5d6dc; border-radius:14px; padding:9px; transition:border-color .18s,box-shadow .18s; }
.scene.active { border-color:var(--rose); box-shadow:0 0 0 3px #fbe1ec; }
.scene.correct { border-color:#25865c; }
.scene.incorrect { border-color:#bb5368; }
.scene img { display:block; width:100%; height:clamp(145px,22vw,215px); object-fit:contain; background:white; }
.scene .slot { min-height:34px; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:5px; border-radius:9px; color:#45323a; background:#fff0f6; font-weight:750; }
.scene .slot.wait { color:#6c6065; background:#f5f1f2; }
.tag.correct { color:#16704d; }.tag.incorrect { color:#a32e4b; }
.controls { padding:18px 8px 3px; text-align:center; }
button { appearance:none; color:var(--ink); font:inherit; font-weight:750; cursor:pointer; border:2px solid var(--line); background:#fce7ef; border-radius:11px; padding:11px 17px; }
button:hover:not(:disabled) { background:#f9d6e4; border-color:var(--rose); }
button:focus-visible { outline:3px solid #975379; outline-offset:3px; }
#startBtn,#retryBtn { font-size:19px; min-width:180px; background:#f2b4cd; border-color:#d97da3; }
#startBtn:hover,#retryBtn:hover { background:#eaa3bf; }
#choiceArea,#resultArea { display:none; }
#prompt { font-weight:800; color:#60394c; font-size:18px; margin:0 0 11px; }
.choices { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
.choice { padding:12px 5px; font-size:clamp(14px,2.1vw,20px); background:#fff; color:#392d33; }
.choice small { display:block; color:#66545c; font-size:clamp(10px,1.2vw,13px); margin-top:3px; font-weight:550; }
.score { font-size:27px; color:#8c365c; font-weight:850; margin-bottom:12px; }
#resultArea { padding:9px; }
@media (max-width:570px) {
 body { padding:12px; }
 .board { gap:7px; }
 .scene { border-width:2px; border-radius:10px; padding:5px; }
 .scene img { height:130px; }
 .scene .slot { min-height:42px; padding:3px 4px; font-size:12px; text-align:center; }
 .choices { gap:6px; }
 .choice { padding:10px 1px; }
 .choice small { font-size:9px; }
}
</style>
</head>
<body>
<main>
  <h1>臺語四格故事挑戰</h1>
  <p class="subtitle">看圖片，選出適合的時間順序詞。</p>
  <section class="board" id="board" aria-label="烏鴉喝水四格漫畫"></section>
  <section class="controls">
    <button id="startBtn" type="button">開始</button>
    <div id="choiceArea">
      <p id="prompt" aria-live="polite"></p>
      <div id="choices" class="choices"></div>
    </div>
    <div id="resultArea" aria-live="polite">
      <div class="score" id="score"></div>
      <button id="retryBtn" type="button">再玩一次</button>
    </div>
  </section>
</main>

const terms = [
 { han:'頭先', tl:'thâu-sing' },
 { han:'紲落來', tl:'suà--lo̍h-lâi' },
 { han:'後來', tl:'āu--lâi' },
 { han:'最後', tl:'tsuè-āu' }
];
const board = document.getElementById('board');
const startBtn = document.getElementById('startBtn');
const choices = document.getElementById('choices');
const choiceArea = document.getElementById('choiceArea');
const resultArea = document.getElementById('resultArea');
const prompt = document.getElementById('prompt');
const scoreText = document.getElementById('score');
const retryBtn = document.getElementById('retryBtn');
let current=-1;
let answers=[];
function renderBoard() {
  board.replaceChildren();
  images.forEach((src,i)=>{
    const scene=document.createElement('div');
    scene.className='scene';
    scene.id='scene-'+i;
    const pic=document.createElement('img');
    pic.alt='四格漫畫第'+(i+1)+'格'; pic.src=src;
    const slot=document.createElement('div');
    slot.className='slot wait'; slot.id='slot-'+i;
    slot.textContent='第 '+(i+1)+' 格';
    scene.append(pic,slot);
    board.appendChild(scene);
  });
}
let choiceOrder = [0, 1, 2, 3];
let previousChoiceOrder = null;
function shuffleAtStart() {
  // スタート時（リトライ時も）に一度だけ並びを決める。
  let indices;
  do {
    indices = [0, 1, 2, 3];
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }
  } while (indices.every((id, pos) => id === pos) ||
           (previousChoiceOrder && indices.every((id, pos) => id === previousChoiceOrder[pos])));
  previousChoiceOrder = [...indices];
  return indices;
}
function startGame() {
  answers=[]; current=0;
  choiceOrder = shuffleAtStart();
  startBtn.style.display='none';
  resultArea.style.display='none';
  choiceArea.style.display='block';
  renderBoard();
  nextQuestion();
}
function nextQuestion() {
  for(let i=0;i<4;i++) document.getElementById('scene-'+i).classList.toggle('active',i===current);
  prompt.textContent='第 '+(current+1)+' 格：應該用哪一個詞？';
  choices.replaceChildren();
  choiceOrder.forEach(i=>{
    const term = terms[i];
    const button=document.createElement('button');
    button.type='button'; button.className='choice';
    const name=document.createElement('span'); name.textContent=term.han;
    const tl=document.createElement('small'); tl.textContent=term.tl;
    button.append(name,tl);
    button.addEventListener('click',()=>submit(i));
    choices.appendChild(button);
  });
}
function submit(i) {
  if(current<0||current>=4)return;
  answers[current]=i;
  const slot=document.getElementById('slot-'+current);
  slot.classList.remove('wait'); slot.textContent=terms[i].han;
  current++;
  if(current===4)showResult(); else nextQuestion();
}
function showResult() {
  choiceArea.style.display='none';
  let score=0;
  answers.forEach((answer,i)=>{
    const correct=answer===i;
    if(correct)score++;
    const scene=document.getElementById('scene-'+i);
    scene.classList.remove('active');
    scene.classList.add(correct?'correct':'incorrect');
    const slot=document.getElementById('slot-'+i);
    slot.replaceChildren();
    const label=document.createElement('span');
    label.textContent='選：'+terms[answer].han;
    const status=document.createElement('span');
    status.className='tag '+(correct?'correct':'incorrect');
    status.textContent=correct?'✓':'✗ 正解：'+terms[i].han;
    slot.append(label,status);
  });
  scoreText.textContent='得分：'+score+' / 4';
  resultArea.style.display='block';
  current=-1;
}
renderBoard();
startBtn.addEventListener('click',startGame);
retryBtn.addEventListener('click',startGame);
</script>
